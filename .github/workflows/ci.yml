name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run playwright install --with-deps chromium
      - run: make lint
      - run: make test
      - run: make e2e
      # The runner has real Docker. Everything else in this project was
      # developed against podman, so this is the only place the Docker claim
      # is actually tested.
      - name: Full stack smoke test on Docker
        run: make smoke
