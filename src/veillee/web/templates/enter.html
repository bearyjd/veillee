{% extends "base.html" %}
{% block title %}Enter — {{ site_name }}{% endblock %}
{% block content %}
<h1>Welcome</h1>
{% if failed %}<p class="notice problem" role="alert">That wasn't right. Try again.</p>{% endif %}
<p class="lede">Type the word you were given. This machine will remember you afterwards.</p>
<form method="post" action="/enter" class="stack">
  <label for="passcode">The word</label>
  <input type="password" id="passcode" name="passcode" autocomplete="current-password" required autofocus>
  <input type="hidden" name="next_path" value="{{ next_path }}">
  <div class="button-row"><button class="button" type="submit">Come in</button></div>
</form>
{% endblock %}
