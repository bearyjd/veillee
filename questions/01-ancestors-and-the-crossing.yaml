chapter:
  order: 1
  slug: ancestors-and-the-crossing
  title: Ancestors and the crossing
questions:
  - id: q001
    text: What are the names of the oldest people in our family you can remember being told about?
    hint: Even a first name and a townland is more than we have written down anywhere.
    follow_ups:
      - Who told you about them?
      - Did anyone ever say who they took after?
  - id: q002
    text: Where in Ireland did our family come from, and how do you know?
    hint: A county, a parish, a townland, a road — whatever you were told.
  - id: q003
    text: Who was the first of our family to leave Ireland, and what did you hear about why they went?
    follow_ups:
      - How old were they?
      - Did they go alone or with somebody?
  - id: q004
    text: What did you hear about the crossing itself — the ship, the money, who saw them off?
    hint: Even a single detail somebody repeated at a table counts.
  - id: q005
    text: Was there anyone left behind, and did the family ever speak of them again?
  - id: q006
    text: What did your grandparents look like, and how did they sound when they talked?
    follow_ups:
      - Did they have an accent that was different from everyone else's?
  - id: q007
    text: What work did your grandparents do, and did anyone in the family follow them into it?
  - id: q008
    text: Is there a story about our family that got told over and over — and do you think it was true?
    hint: The ones that got polished by retelling are worth keeping too.
  - id: q009
    text: What do you wish you had asked your own parents or grandparents while they were still here?
