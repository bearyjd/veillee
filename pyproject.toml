[project]
name = "veillee"
version = "0.1.0"
description = "A private oral history site. One voice, kept whole."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "pyyaml==6.0.2",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "faster-whisper==1.1.1",
    "requests==2.32.3",
]

[project.scripts]
veillee = "veillee.cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "playwright==1.49.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
    "types-PyYAML==6.0.12.20241230",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veillee"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src/veillee"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
